# Hand-calculated benchmark expectations (Task 12b, Add-D). NEVER regenerate from the engine.
#
# Every value below was derived by hand from D6/D7 and config/default.yaml (scoring 1.0.0):
#   weights delivery 0.30, quality 0.25, cost 0.15, capacity 0.10, compliance 0.10,
#   disruption 0.10; grace 24 h; delay penalty 2/day capped at 20; defect_rate_zero_score 0.10;
#   variance_zero_score 0.10; capacity 0.80->100, 1.00->70, 1.50->0; HIGH weight 30;
#   recency 90 days; lookback 180 days; resolved multiplier 0.5.
# Evidence per quarter (tests/scoring/benchmarks/scenarios.py): 20 due shipments, each with one
# 100-unit line inspected once (2,000 inspected) and one invoice expected 1000.00 (sum 20,000);
# capacity: VERIFIED free 2,000 units every month, demand = util x 2,000 every month;
# requirements: ISO9001 and ISO14001, both mandatory; one MONITORING_ATTESTATION per quarter.
# Overall = round2(sum w_k * round2(c_k)) (sum of weights = 1.00).
#
# exp() constants (computed with a Python REPL, math.exp; arithmetic, not the engine):
#   exp(-45/90)  = exp(-0.5)      = 0.6065306597  -> 30 x = 18.1959198
#   exp(-137/90) = exp(-1.52222)  = 0.2182264002  -> 30 x = 6.5467920, 15 x = 3.2733960
# Signal ages (age = C - observed, observed at 23:59:59 so ages are whole days):
#   observed 2025-08-16 -> Q3 C 2025-09-30: 15 + 30 = 45 d; Q4 C 2025-12-31: 45 + 31+30+31 = 137 d
#   observed 2025-05-16 -> Q2 C 2025-06-30: 15 + 30 = 45 d; Q3 C: 45 + 31+31+30 = 137 d;
#                          Q4 C: 137 + 92 = 229 d > 180 -> outside the lookback
#   observed 2025-02-14 -> Q1 C 2025-03-31: 14 + 31 = 45 d

scenarios:
  stable:
    - quarter: Q1
      delivery: 91.00     # 100 x 19/20 - min(20, 2 x 2) = 95 - 4
      quality: 95.00      # 10/2000 = 0.005; 100 x (1 - 0.005/0.10) = 100 x 0.95
      cost: 100.00        # 20 x (1000.00 -> 1000.00): wavp = 0/20000 = 0
      capacity: 100.00    # util 1200/2000 = 0.60 <= 0.80
      compliance: 100.00  # ISO9001 COMPLIANT, ISO14001 COMPLIANT: (100 + 100)/2
      disruption: 100.00  # attestation only: penalty 0
      overall: 96.05      # 27.30 + 23.75 + 15.00 + 10.00 + 10.00 + 10.00
      category: HIGH      # 85 <= 96.05 <= 100
      decision: PREFERRED # no override; HIGH -> PREFERRED
    - quarter: Q2
