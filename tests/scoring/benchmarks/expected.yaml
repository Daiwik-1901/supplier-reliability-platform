# One-factor perturbations of the stable Q1 evidence (baseline: stable Q1 above, overall 96.05).
# overall = 96.05 + weight x delta (component scores are 2 dp, so weight x delta is exact).
one_factor:
  delivery:     # late shipment 2 d -> 7 d late
    score: 81.00    # 100 x 19/20 - min(20, 2 x 7) = 95 - 14
    delta: -10.00   # 81.00 - 91.00
    overall: 93.05  # 96.05 + 0.30 x (-10.00) = 96.05 - 3.00
  quality:      # defects 10 -> 30 per 2,000 (0.5 % -> 1.5 %)
    score: 85.00    # 30/2000 = 0.015 -> 100 x (1 - 0.15)
    delta: -10.00   # 85.00 - 95.00
    overall: 93.55  # 96.05 + 0.25 x (-10.00) = 96.05 - 2.50
  cost:         # every invoice overbilled 3 %: 1000.00 -> 1030.00
    score: 70.00    # wavp 600/20000 = 0.03 -> 100 x (1 - 0.3)
    delta: -30.00   # 70.00 - 100.00
    overall: 91.55  # 96.05 + 0.15 x (-30.00) = 96.05 - 4.50
  capacity:     # demand 1200 -> 2400 per month against 2000 free: util 0.6 -> 1.2
    score: 42.00    # 70 - 70 x (1.20 - 1.00)/0.50 = 70 - 28
    delta: -58.00   # 42.00 - 100.00
    overall: 90.25  # 96.05 + 0.10 x (-58.00) = 96.05 - 5.80
  compliance:   # mandatory ISO9001 EXPIRED (valid_to 2025-02-14 < C 2025-03-31)
    score: 50.00    # (0 + 100)/2
    delta: -50.00   # 50.00 - 100.00
    overall: 91.05  # 96.05 + 0.10 x (-50.00) = 96.05 - 5.00
  disruption:   # + HIGH open signal observed 2025-02-14T23:59:59 (age 45 d at C)
    score: 81.80    # 100 - 30 x exp(-0.5) = 100 - 18.1959 = 81.8041
    delta: -18.20   # 81.80 - 100.00
    overall: 94.23  # 96.05 + 0.10 x (-18.20) = 96.05 - 1.82
