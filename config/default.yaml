# Default configuration. Changing any scoring parameter requires bumping scoring.scoring_version.
scoring:
  scoring_version: "1.0.0"
  weights:
    delivery: 0.30
    quality: 0.25
    cost: 0.15
    capacity: 0.10
    compliance: 0.10
    disruption: 0.10
  category_thresholds:   # lower inclusive, upper exclusive (the top band includes 100)
    HIGH: {lower: 85, upper: 100}
    ACCEPTABLE: {lower: 70, upper: 85}
    AT_RISK: {lower: 50, upper: 70}
    CRITICAL: {lower: 0, upper: 50}
  grace_hours: 24
  min_observations:
    delivery: 5
    quality: 3
    cost: 3
  coverage_threshold: 0.70
  delivery:
    delay_penalty_per_day: 2
    delay_penalty_cap: 20
  defect_rate_zero_score: 0.10
  variance_zero_score: 0.10
  underbilling_weight: 0.5
  capacity_breakpoints:   # utilisation -> score; linear between points, 0 beyond the last
    - {utilization: 0.80, score: 100}
    - {utilization: 1.00, score: 70}
    - {utilization: 1.50, score: 0}
  compliance_points:
    COMPLIANT: 100
    PENDING_VERIFICATION: 50
    EXPIRED: 0
    NONCOMPLIANT: 0
  severity_weights:
    NONE: 0
    LOW: 5
    MEDIUM: 15
    HIGH: 30
    CRITICAL: 50
  recency_days: 90
  lookback_days: 180
  window_months: 12        # trailing calendar months per scorecard window (R25)
  resolved_multiplier: 0.5
  inactive_site_multiplier: 0.5
  dedup_window_days: 7
  deteriorating_threshold: 10

